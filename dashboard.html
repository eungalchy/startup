<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spender - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <h1>Spender</h1>
        <nav>
            <a href="index.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="group.html">Group</a>
        </nav>
    </header>
    <main class="container">
        <h2>Dashboard</h2>
        <img src="spender_logo.png" alt="Spender logo" />
        <p>Welcome, <span id="username">User</span>!</p>

        <div class="card">
            <h3>Your Expenses</h3>
            <table>
                <tr>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
                <tr>
                    <td>Food</td>
                    <td>$12.00</td>
                    <td>2026-06-28</td>
                </tr>
                <tr>
                    <td>Transport</td>
                    <td>$5.00</td>
                    <td>2026-06-27</td>
                </tr>
            </table>
        </div>

        <div class="card">
            <h3>Exchange Rates</h3>
            <p>1 USD = <span id="exchange-rate">loading...</span> KRW</p>
        </div>

        <div class="card">
            <h3>Updates</h3>
            <p id="updates">Waiting for the group activities...</p>
        </div>

        <button class="btn btn-primary">+ Add Expense</button>
    </main>

    <footer>
        <p>Made by Jinho Lee</p>
        <a href="https://github.com/eungalchy/startup">GitHub</a>
    </footer>
</body>

</html>
